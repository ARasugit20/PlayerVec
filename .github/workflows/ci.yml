name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check tests/

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --cov=data --cov=model --cov=search --cov=team --cov=api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run pipeline (sample data for CI speed)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m data.scraper --source sample --sample-size 200
          python -m model.train --epochs 30
          python -m model.embed
          python -m search.index
          python -m search.umap_project
          python -m model.evaluate
          python -m team.evaluate

      - name: API smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -sf "http://127.0.0.1:8000/health"
          PLAYER=$(curl -sf "http://127.0.0.1:8000/players" | python -c "import sys,json; print(json.load(sys.stdin)[0])")
          curl -sf "http://127.0.0.1:8000/players?q=Bell" | head -c 200
          curl -sf "http://127.0.0.1:8000/similar?player=$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$PLAYER")&k=3" | head -c 500
          curl -sf "http://127.0.0.1:8000/teams" | head -c 200
          TEAM_A=$(curl -sf "http://127.0.0.1:8000/teams" | python -c "import sys,json; print(json.load(sys.stdin)[0])")
          TEAM_B=$(curl -sf "http://127.0.0.1:8000/teams" | python -c "import sys,json; t=json.load(sys.stdin); print(t[1] if len(t)>1 else t[0])")
          curl -sf "http://127.0.0.1:8000/fixture-brief?team_a=${TEAM_A}&team_b=${TEAM_B}" | head -c 800

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install & build
        working-directory: client
        run: |
          npm install
          npm run build
